<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calling UI</title>
</head>
<body>

    <button id="openCallBtn" class="trigger-btn">Confirm Order</button>

    <script>
        (function() {
            // === ১. সমস্ত CSS স্টাইল স্ক্রিপ্টের মাধ্যমে ইনজেক্ট করা ===
            const style = document.createElement('style');
            style.innerHTML = `
                * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

                body {
                    background: #0f172a;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                }

                .trigger-btn {
                    padding: 12px 25px;
                    background: #2563eb;
                    color: #fff;
                    border: none;
                    border-radius: 8px;
                    cursor: pointer;
                    font-size: 16px;
                    font-weight: bold;
                    transition: background 0.2s;
                }
                .trigger-btn:hover { background: #1d4ed8; }

                .call-overlay {
                    position: fixed;
                    width: 100%;
                    height: 100%;
                    background: #020617;
                    top: 0;
                    left: 0;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    opacity: 0;
                    visibility: hidden;
                    transition: .3s;
                    z-index: 9999;
                }

                .call-overlay.active {
                    opacity: 1;
                    visibility: visible;
                }

                .call-card {
                    width: 360px;
                    background: linear-gradient(145deg, #020617, #0f172a);
                    border-radius: 25px;
                    padding: 30px;
                    text-align: center;
                    color: #fff;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                }

                .profile-circle {
                    width: 100px;
                    height: 100px;
                    border-radius: 50%;
                    border: 3px solid #14b8a6;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    margin: auto;
                    font-size: 35px;
                    background: rgba(20, 184, 166, 0.1);
                }

                .brand-name { font-size: 22px; margin-top: 10px; font-weight: bold; }
                .phone-number { color: #94a3b8; margin-bottom: 15px; }
                .calling-status { margin: 15px 0; color: #14b8a6; font-weight: 500; }

                .btn-group { display: flex; gap: 15px; justify-content: center; }

                .btn-call {
                    padding: 12px 18px;
                    border: none;
                    border-radius: 12px;
                    cursor: pointer;
                    font-weight: bold;
                    min-width: 110px;
                }

                .accept-btn { background: #14b8a6; color: #000; }
                .decline-btn { background: #1e293b; color: #fff; }

                .end-btn {
                    margin-top: 15px;
                    width: 100%;
                    padding: 12px;
                    border: none;
                    border-radius: 12px;
                    background: #ef4444;
                    color: #fff;
                    font-weight: bold;
                    cursor: pointer;
                }
                .end-btn:hover { background: #dc2626; }

                .timer {
                    color: #22c55e;
                    font-size: 24px;
                    margin: 15px 0;
                    font-weight: bold;
                    font-variant-numeric: tabular-nums;
                }
            `;
            document.head.appendChild(style);

            // === ২. কলিং UI-এর HTML স্ট্রাকচার ডাইনামিকালি তৈরি করা ===
            const modalContainer = document.createElement('div');
            modalContainer.innerHTML = `
                <div id="callModal" class="call-overlay">
                    <div class="call-card">
                        <div id="callingUI">
                            <div class="profile-circle">?</div>
                            <div class="brand-name">Bikroy Baazar</div>
                            <div class="phone-number">01752774046</div>
                            <div class="calling-status" id="statusText">Calling...</div>

                            <div class="btn-group">
                                <button class="btn-call decline-btn" id="declineCallBtn">Decline</button>
                                <button class="btn-call accept-btn" id="acceptCallBtn">Accept</button>
                            </div>
                        </div>

                        <div id="connectedUI" style="display:none;">
                            <div class="profile-circle">?</div>
                            <div class="brand-name">Bikroy Baazar</div>
                            <div class="phone-number">01752774046</div>

                            <div id="callTimer" class="timer">00:00</div>

                            <div class="btn-group">
                                <button class="btn-call accept-btn">Confirm Order</button>
                                <button class="btn-call decline-btn">Cancel Order</button>
                            </div>

                            <button id="endCallBtn" class="end-btn">End Call</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modalContainer);

            // === ৩. লজিক ও ফাংশনালিটি হ্যান্ডেল করা ===
            const openCallBtn = document.getElementById('openCallBtn');
            const callModal = document.getElementById('callModal');
            const acceptCallBtn = document.getElementById('acceptCallBtn');
            const declineCallBtn = document.getElementById('declineCallBtn');
            const endCallBtn = document.getElementById('endCallBtn');

            const callingUI = document.getElementById('callingUI');
            const connectedUI = document.getElementById('connectedUI');
            const callTimer = document.getElementById('callTimer');

            const toneSrc = "public/calling-tone.mp3";
            const instructionSrc = "public/call_instruction.mp3";

            let callingAudio = new Audio(toneSrc);
            callingAudio.loop = true;

            let instructionAudio = new Audio(instructionSrc);

            let callTimeout;
            let autoOpenTimeout;
            let timerInterval;
            let seconds = 0;
            let isCallStarted = false; // ডুপ্লিকেট ওপেনিং রোধ করার জন্য

            // 📞 কল শুরু করার মেইন ফাংশন
            function startCallingProcess() {
                if (isCallStarted) return; // কল অলরেডি চালু থাকলে আর কাজ করবে না
                isCallStarted = true;

                // অটো ওপেন টাইমার ক্লিয়ার করে দেওয়া যাতে ডাবল ট্রিগার না হয়
                clearTimeout(autoOpenTimeout);

                callModal.classList.add('active');
                callingUI.style.display = "block";
                connectedUI.style.display = "none";

                callingAudio.play().catch(err => console.log("Audio play blocked by browser:", err));

                // ৩০ সেকেন্ড পর রেসপন্স না থাকলে অটো কেটে যাবে
                callTimeout = setTimeout(() => {
                    resetCallSystem();
                    alert("No Answer");
                }, 30000);
            }

            // 🔘 MANUAL OPEN (বাটনে ক্লিক করলে)
            openCallBtn.onclick = () => {
                startCallingProcess();
            };

            // ⏱️ AUTO OPEN (২৫ সেকেন্ড পর অটোমেটিক কল ওপেন হবে)
            if (window.location.pathname.includes('/confirm-order')) {
                autoOpenTimeout = setTimeout(() => {
                    startCallingProcess();
                }, 25000); // 25000ms = 25 Seconds
            }

            // ❌ DECLINE CALL
            declineCallBtn.onclick = () => {
                resetCallSystem();
            };

            // ✅ ACCEPT CALL
            acceptCallBtn.onclick = () => {
                clearTimeout(callTimeout);
                callingAudio.pause();
                callingAudio.currentTime = 0;

                callingUI.style.display = "none";
                connectedUI.style.display = "block";

                instructionAudio.play().catch(err => console.log("Audio play blocked by browser:", err));

                startTimer();
            };

            // 🔴 END CALL
            endCallBtn.onclick = () => {
                resetCallSystem();
            };

            // ⏱ TIMER FUNCTION
            function startTimer() {
                clearInterval(timerInterval);
                seconds = 0;
                callTimer.innerText = "00:00";

                timerInterval = setInterval(() => {
                    seconds++;
                    let m = String(Math.floor(seconds / 60)).padStart(2, '0');
                    let s = String(seconds % 60).padStart(2, '0');
                    callTimer.innerText = m + ":" + s;
                }, 1000);
            }

            // 🔄 RESET SYSTEM
            function resetCallSystem() {
                clearTimeout(callTimeout);
                clearTimeout(autoOpenTimeout);
                clearInterval(timerInterval);

                callingAudio.pause();
                callingAudio.currentTime = 0;

                instructionAudio.pause();
                instructionAudio.currentTime = 0;

                callModal.classList.remove('active');
                isCallStarted = false; // সিস্টেম রিসেট হলে আবার কল করার সুযোগ থাকবে

                // UI রি-ইনিশিয়ালাইজ করা
                setTimeout(() => {
                    callingUI.style.display = "block";
                    connectedUI.style.display = "none";
                    callTimer.innerText = "00:00";
                }, 300);
            }
        })();
    </script>

</body>
</html>
